apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homepage-public
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/mcdays94/k3s-gitops.git
    targetRevision: HEAD
    path: apps/homepage-public
  destination:
    server: https://kubernetes.default.svc
    namespace: homepage-public
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
