apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: homepage-public
data:
  settings.yaml: |
    title: Miguel's Homelab
    theme: dark
    color: slate
    headerStyle: boxed
    target: _self
    disableHostValidation: true
    layout:
      - Infrastructure:
          style: row
          columns: 3
      - Monitoring:
          style: row
          columns: 2

  services.yaml: |
    - Infrastructure:
        - AdGuard Home (K3s):
            icon: adguard-home.png
            description: DNS Filtering (Cluster)
            widget:
              type: adguard
              url: http://10.10.10.205
              username: {{HOMEPAGE_VAR_ADGUARD_K3S_USERNAME}}
              password: {{HOMEPAGE_VAR_ADGUARD_K3S_PASSWORD}}
        - AdGuard Home (Origin):
            icon: adguard-home.png
            description: DNS Filtering (Backup)
            widget:
              type: adguard
              url: http://10.10.10.79
              username: {{HOMEPAGE_VAR_ADGUARD_ORIGIN_USERNAME}}
              password: {{HOMEPAGE_VAR_ADGUARD_ORIGIN_PASSWORD}}
        - AdGuard Home (Pi4):
            icon: adguard-home.png
            description: DNS Filtering (Pi4)
            widget:
              type: adguard
              url: http://10.10.10.23
              username: {{HOMEPAGE_VAR_ADGUARD_PI4_USERNAME}}
              password: {{HOMEPAGE_VAR_ADGUARD_PI4_PASSWORD}}

    - Monitoring:
        - Uptime Kuma:
            icon: uptime-kuma.png
            description: Service Monitoring
            widget:
              type: uptimekuma
              url: http://10.10.10.202:3001
              slug: default
        - Home Power:
            icon: home-assistant.png
            description: Homelab Power Consumption
            widget:
              type: homeassistant
              url: http://10.10.10.189:8123
              key: {{HOMEPAGE_VAR_HOMEASSISTANT_KEY}}
              custom:
                - state: sensor.smartplughomelab_power
                  label: homelab power
                  value: "{state} W"

  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "K3s Cluster"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true

    - datetime:
        text_size: xl
        format:
          timeStyle: short
          dateStyle: short

  bookmarks.yaml: |
    - Links:
        - Blog:
            - icon: mdi-post
              href: https://mdias.info
              abbr: mdias.info

  docker.yaml: ""
  proxmox.yaml: ""
  custom.css: |
    /* Remove all hyperlinks */
    .service-card a, .service-title a {
      pointer-events: none !important;
      cursor: default !important;
      text-decoration: none !important;
    }
    
    /* Frosted Glass Theme */
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      background-attachment: fixed;
    }
    
    /* Glassmorphism for all cards */
    .service-card, .resource-card, .widget-card, [class*="card"] {
      background: rgba(255, 255, 255, 0.1) !important;
      backdrop-filter: blur(10px) !important;
      -webkit-backdrop-filter: blur(10px) !important;
      border: 1px solid rgba(255, 255, 255, 0.2) !important;
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37) !important;
    }
    
    /* Service sections */
    section {
      background: rgba(255, 255, 255, 0.05) !important;
      backdrop-filter: blur(15px) !important;
      -webkit-backdrop-filter: blur(15px) !important;
      border-radius: 12px !important;
      border: 1px solid rgba(255, 255, 255, 0.1) !important;
    }
    
    /* Widget containers */
    .widgets {
      background: rgba(255, 255, 255, 0.05) !important;
      backdrop-filter: blur(15px) !important;
      -webkit-backdrop-filter: blur(15px) !important;
      border-radius: 12px !important;
    }
    
    /* Enhance text readability on glass */
    h1, h2, h3, h4, h5, h6, p, span, div {
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
    }
  custom.js: ""
  kubernetes.yaml: |
    mode: cluster
