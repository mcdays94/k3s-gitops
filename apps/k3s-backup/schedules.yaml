---
# Pocket ID - weekly backup, Sundays at 02:00
apiVersion: k8up.io/v1
kind: Schedule
metadata:
  name: pocket-id-backup
  namespace: pocket-id
spec:
  resourceRequirementsTemplate:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "500m"
  backend:
    repoPasswordSecretRef:
      name: k8up-repo-password
      key: password
    s3:
      endpoint: https://9993650612175c36066a397a94466033.r2.cloudflarestorage.com
      bucket: r2-backups
      accessKeyIDSecretRef:
        name: k8up-s3-credentials
        key: access-key-id
      secretAccessKeySecretRef:
        name: k8up-s3-credentials
        key: secret-access-key
  backup:
    schedule: "0 2 * * 0"
    failedJobsHistoryLimit: 2
    successfulJobsHistoryLimit: 2
  prune:
    schedule: "0 4 * * 0"
    retention:
      keepWeekly: 4
      keepMonthly: 3
  check:
    schedule: "0 5 * * 0"
