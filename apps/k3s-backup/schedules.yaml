---
# Pocket ID - daily backup at 02:00
apiVersion: k8up.io/v1
kind: Schedule
metadata:
  name: pocket-id-backup
  namespace: pocket-id
spec:
  backend:
    repoPasswordSecretRef:
      name: k8up-repo-password
      key: password
    s3:
      endpoint: https://9993650612175c36066a397a94466033.r2.cloudflarestorage.com
      bucket: r2-backups
      accessKeyIDSecretRef:
        name: k8up-s3-credentials
        key: access-key-id
      secretAccessKeySecretRef:
        name: k8up-s3-credentials
        key: secret-access-key
  backup:
    schedule: "0 2 * * *"
    failedJobsHistoryLimit: 3
    successfulJobsHistoryLimit: 3
  prune:
    schedule: "0 5 * * 0"
    retention:
      keepDaily: 7
      keepWeekly: 4
      keepMonthly: 3
  check:
    schedule: "0 6 * * 0"
