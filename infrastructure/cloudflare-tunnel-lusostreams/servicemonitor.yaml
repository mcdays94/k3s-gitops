apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cloudflared-metrics
  namespace: cloudflare-tunnel-lusostreams
  labels:
    release: kube-prometheus-stack
spec:
  jobLabel: cloudflared-metrics
  endpoints:
  - port: metrics
    interval: 30s
    path: /metrics
  namespaceSelector:
    matchNames:
    - cloudflare-tunnel-lusostreams
  selector:
    matchLabels:
      app: cloudflared-lusostreams
