apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: cloudflare-tunnel-lusostreams
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudflared-lusostreams
  template:
    metadata:
      labels:
        app: cloudflared-lusostreams
    spec:
      containers:
      - name: cloudflared
        image: cloudflare/cloudflared:latest
        args:
          - tunnel
          - --metrics
          - 0.0.0.0:2000
          - --no-autoupdate
          - run
          - --token
          - $(TUNNEL_TOKEN)
        ports:
        - name: metrics
          containerPort: 2000
          protocol: TCP
        env:
        - name: TUNNEL_TOKEN
          valueFrom:
            secretKeyRef:
              name: tunnel-token
              key: token
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
